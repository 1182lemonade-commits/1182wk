<!doctype html>
<html lang="ko" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>S1182 WK Application</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #171a21;
      --muted: #697386;
      --border: #dfe3eb;
      --input: #ffffff;
      --accent: #315efb;
      --accent-text: #ffffff;
      --danger: #d92d20;
      --success: #16803c;
      --shadow: 0 12px 32px rgba(0, 0, 0, .08);
    }

    html[data-theme="dark"] {
      --bg: #111318;
      --panel: #191c23;
      --text: #f2f4f7;
      --muted: #a6adbb;
      --border: #343944;
      --input: #22262f;
      --accent: #6f8cff;
      --accent-text: #ffffff;
      --danger: #ff746b;
      --success: #62d98b;
      --shadow: 0 12px 32px rgba(0, 0, 0, .25);
    }

    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        --bg: #111318;
        --panel: #191c23;
        --text: #f2f4f7;
        --muted: #a6adbb;
        --border: #343944;
        --input: #22262f;
        --accent: #6f8cff;
        --accent-text: #ffffff;
        --danger: #ff746b;
        --success: #62d98b;
        --shadow: 0 12px 32px rgba(0, 0, 0, .25);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        "Noto Sans JP",
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar-select {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.2;
    }

    .description {
      color: var(--muted);
      margin: 10px 0 0;
      white-space: pre-wrap;
    }

    .survey-state {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 700;
    }

    .survey-state.open {
      color: var(--success);
    }

    .survey-state.closed {
      color: var(--danger);
    }

    form {
      margin-top: 28px;
    }

    .field {
      margin-bottom: 24px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .required {
      color: var(--danger);
    }

    input[type="text"],
    select {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px
        color-mix(in srgb, var(--accent) 15%, transparent);
    }

    .choices {
      display: grid;
      gap: 9px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
    }

    .choice input {
      margin: 4px 0 0;
      flex: 0 0 auto;
    }

    .agreement {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .submit-row {
      margin-top: 30px;
    }

    .submit-button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      text-align: center;
      font-weight: 700;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 28px 0 8px;
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 18px, 760px);
        padding-top: 12px;
      }

      .panel {
        padding: 20px 16px;
        border-radius: 14px;
      }
    }
  </style>
</head>

        <!-- RALLY SIZE -->

            집결 규모

          </div>

        </div>


        <!-- CAPTAIN -->

        <div class="submit-row">

            id="submitButton"

  // =========================================================
  // SUPABASE REST
  // =========================================================

  async function supabaseGet(
    table,
    query = ""
  ) {
    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        table +
        query,
        {
          headers: {
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );

    if (!response.ok) {
      throw new Error(
        "Supabase request failed: " +
        response.status
      );
    }

    return response.json();
  }


  // =========================================================
  // LOAD FORM
  // =========================================================

  async function loadForm() {
    loadingMessage.textContent =
      t().loading;

    try {

      const [
        settingsData,
        tierData,
        allianceData,
        agreementData
      ] = await Promise.all([

        supabaseGet(
          "survey_settings",
          "?select=*&order=id.asc&limit=1"
        ),

        supabaseGet(
          "tiers",
          "?select=id,name,sort_order&is_active=eq.true&order=sort_order.asc,id.asc"
        ),

        supabaseGet(
          "alliances",
          "?select=id,name,sort_order&is_active=eq.true&order=sort_order.asc,id.asc"
        ),

        supabaseGet(
          "agreement_items",
          "?select=id,content_ko,content_en,content_ja,content_ru,is_required,sort_order&is_active=eq.true&order=sort_order.asc,id.asc"
        )

      ]);


      settings =
        settingsData[0] || null;

      tiers =
        tierData || [];

      alliances =
        allianceData || [];

      agreements =
        agreementData || [];


      loadingMessage.classList.add(
        "hidden"
      );


      renderLanguage();


      if (
        settings?.is_open
      ) {
        wkForm.classList.remove(
          "hidden"
        );
      } else {
        wkForm.classList.add(
          "hidden"
        );
      }

    } catch (error) {

      console.error(error);

      loadingMessage.textContent =
        t().loadFailed;

      surveyState.textContent =
        t().loadFailed;

      surveyState.className =
        "survey-state closed";

    }
  }


  // =========================================================
  // SURVEY STATE
  // =========================================================

  function renderSurveyState() {

    if (!settings) {

      surveyState.textContent =
        t().loading;

      surveyState.className =
        "survey-state";

      return;
    }


    if (settings.is_open) {

      surveyState.textContent =
        t().open;

      surveyState.className =
        "survey-state open";

    } else {

      surveyState.textContent =
        t().closed;

      surveyState.className =
        "survey-state closed";

    }
  }


  // =========================================================
  // TIER / ALLIANCE
  // =========================================================

  function renderSelects() {

    const tier =
      document.getElementById(
        "tier"
      );

    const alliance =
      document.getElementById(
        "alliance"
      );


    const selectedTier =
      tier.value;

    const selectedAlliance =
      alliance.value;


    tier.innerHTML = "";


    const tierPlaceholder =
      document.createElement(
        "option"
      );

    tierPlaceholder.value = "";

    tierPlaceholder.textContent =
      t().select;

    tier.appendChild(
      tierPlaceholder
    );


    for (const item of tiers) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        item.id;

      option.textContent =
        item.name;

      tier.appendChild(
        option
      );
    }


    alliance.innerHTML = "";


    const alliancePlaceholder =
      document.createElement(
        "option"
      );

    alliancePlaceholder.value = "";

    alliancePlaceholder.textContent =
      t().select;

    alliance.appendChild(
      alliancePlaceholder
    );


    for (
      const item of alliances
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        item.id;

      option.textContent =
        item.name;

      alliance.appendChild(
        option
      );
    }


    if (
      [...tier.options].some(
        option =>
          option.value ===
          selectedTier
      )
    ) {
      tier.value =
        selectedTier;
    }


    if (
      [...alliance.options].some(
        option =>
          option.value ===
          selectedAlliance
      )
    ) {
      alliance.value =
        selectedAlliance;
    }
  }


  // =========================================================
  // RADIO GROUP
  // =========================================================

  function createRadioGroup(
    containerId,
    name,
    values,
    labels
  ) {

    const container =
      document.getElementById(
        containerId
      );


    const previous =
      document.querySelector(
        'input[name="' +
        name +
        '"]:checked'
      )?.value;


    container.innerHTML = "";


    values.forEach(
      (value, index) => {

        const label =
          document.createElement(
            "label"
          );

        label.className =
          "choice";


        const input =
          document.createElement(
            "input"
          );

        input.type =
          "radio";

        input.name =
          name;

        input.value =
          value;

        input.required =
          true;


        if (
          previous === value
        ) {
          input.checked =
            true;
        }


        const span =
          document.createElement(
            "span"
          );

        span.textContent =
          labels[index];


        label.appendChild(
          input
        );

        label.appendChild(
          span
        );

        container.appendChild(
          label
        );
      }
    );
  }


  function renderChoices() {

    const lang =
      t();


    createRadioGroup(
      "troopTypeChoices",
      "troopType",

      [
        "infantry",
        "cavalry",
        "archer"
      ],

      lang.troopTypes
    );


    createRadioGroup(
      "realtimeChoices",
      "realtimeResponse",

      [
        "available",
        "difficult"
      ],

      lang.realtimeOptions
    );


    createRadioGroup(
      "captainRoleChoices",
      "captainRole",

      [
        "available",
        "unavailable"
      ],

      lang.captainOptions
    );


    createRadioGroup(
      "participationTimeChoices",
      "participationTime",

      [
        "full",
        "partial"
      ],

      lang.participationOptions
    );
  }


  // =========================================================
  // AGREEMENT TRANSLATION
  // =========================================================

  function getAgreementText(
    item
  ) {

    switch (
      currentLanguage
    ) {

      case "ko":
        return (
          item.content_ko || ""
        );

      case "en":
        return (
          item.content_en || ""
        );

      case "ja":
        return (
          item.content_ja || ""
        );

      case "ru":
        return (
          item.content_ru || ""
        );

      default:
        return (
          item.content_ko || ""
        );
    }
  }


  // =========================================================
  // DYNAMIC AGREEMENTS
  // =========================================================

  function renderAgreements() {

    const container =
      document.getElementById(
        "agreementContainer"
      );


    /*
      언어를 변경해도
      이미 체크한 상태는 유지한다.
    */

    const checked =
      new Set(
        [
          ...container.querySelectorAll(
            'input[data-agreement="true"]:checked'
          )
        ].map(
          input =>
            String(input.value)
        )
      );


    container.innerHTML = "";


    for (
      const item of agreements
    ) {

      const field =
        document.createElement(
          "div"
        );

      field.className =
        "field agreement";


      const label =
        document.createElement(
          "label"
        );

      label.className =
        "choice";


      const input =
        document.createElement(
          "input"
        );

      input.type =
        "checkbox";

      input.value =
        item.id;

      input.dataset.agreement =
        "true";

      input.required =
        item.is_required === true;


      if (
        checked.has(
          String(item.id)
        )
      ) {
        input.checked =
          true;
      }


      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        getAgreementText(
          item
        );


      if (
        item.is_required
      ) {

        const required =
          document.createElement(
            "span"
          );

        required.className =
          "required";

        required.textContent =
          " *";

        span.appendChild(
          required
        );
      }


      label.appendChild(
        input
      );

      label.appendChild(
        span
      );

      field.appendChild(
        label
      );

      container.appendChild(
        field
      );
    }
  }


  // =========================================================
  // NUMERIC INPUT
  // =========================================================

  function setupNumericInput(
    id
  ) {

    const input =
      document.getElementById(
        id
      );

    input.addEventListener(
      "input",
      () => {

        input.value =
          input.value.replace(
            /[^\d]/g,
            ""
          );

      }
    );
  }


  setupNumericInput(
    "troopSize"
  );

  setupNumericInput(
    "rallySize"
  );


  // =========================================================
  // SUBMIT
  // =========================================================

  wkForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      formStatus.textContent =
        "";

      formStatus.className =
        "status";


      if (
        !settings?.is_open
      ) {

        formStatus.textContent =
          t().closed;

        formStatus.className =
          "status error";

        return;
      }


      if (
        !wkForm.reportValidity()
      ) {
        return;
      }


      const troopType =
        document.querySelector(
          'input[name="troopType"]:checked'
        );


      const realtime =
        document.querySelector(
          'input[name="realtimeResponse"]:checked'
        );


      const captain =
        document.querySelector(
          'input[name="captainRole"]:checked'
        );


      const participation =
        document.querySelector(
          'input[name="participationTime"]:checked'
        );


      const agreementIds =
        [
          ...document.querySelectorAll(
            'input[data-agreement="true"]:checked'
          )
        ].map(
          input =>
            Number(
              input.value
            )
        );


      // =====================================================
      // PAYLOAD
      // =====================================================

      const payload = {

        /*
          새 wk-submit에서 필수.
          서버가 이 언어에 해당하는
          동의문구를 스냅샷으로 저장한다.
        */

        language:
          currentLanguage,


        player_name:
          document
            .getElementById(
              "playerName"
            )
            .value
            .trim(),


        tier_id:
          Number(
            document
              .getElementById(
                "tier"
              )
              .value
          ),


        alliance_id:
          Number(
            document
              .getElementById(
                "alliance"
              )
              .value
          ),


        troop_type:
          troopType?.value ||
          "",


        troop_size:
          Number(
            document
              .getElementById(
                "troopSize"
              )
              .value
          ),


        rally_size:
          Number(
            document
              .getElementById(
                "rallySize"
              )
              .value
          ),


        realtime_response:
          realtime?.value ||
          "",


        captain_role:
          captain?.value ||
          "",


        participation_time:
          participation?.value ||
          "",


        agreements:
          agreementIds
      };


      // =====================================================
      // SUBMIT START
      // =====================================================

      submitButton.disabled =
        true;

      submitButton.textContent =
        t().submitting;


      try {

        const response =
          await fetch(
            SUBMIT_URL,
            {
              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json",

                apikey:
                  SUPABASE_KEY
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        const result =
          await response
            .json()
            .catch(
              () => ({})
            );


        // ===================================================
        // ERROR
        // ===================================================

        if (
          !response.ok
        ) {

          if (
            result.error ===
            "SURVEY_CLOSED"
          ) {

            settings.is_open =
              false;

            renderSurveyState();

            wkForm.classList.add(
              "hidden"
            );

            throw new Error(
              "SURVEY_CLOSED"
            );
          }


          throw new Error(
            result.error ||
            "SUBMIT_FAILED"
          );
        }


        // ===================================================
        // SUCCESS
        // ===================================================

        wkForm.reset();


        formStatus.textContent =
          t().success;

        formStatus.className =
          "status success";


        window.scrollTo({
          top:
            document.body
              .scrollHeight,

          behavior:
            "smooth"
        });


      } catch (error) {

        console.error(
          error
        );


        if (
          error.message !==
          "SURVEY_CLOSED"
        ) {

          formStatus.textContent =
            t().submitFailed;

          formStatus.className =
            "status error";
        }


      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          t().submit;

      }

    }
  );


  // =========================================================
  // START
  // =========================================================

  renderLanguage();

  loadForm();

</script>
