<!doctype html>
<html lang="ko" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>S1182 WK Application</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #171a21;
      --muted: #697386;
      --border: #dfe3eb;
      --input: #ffffff;
      --accent: #315efb;
      --accent-text: #ffffff;
      --success: #16803c;
      --danger: #d92d20;
      --shadow: 0 12px 30px rgba(0,0,0,.07);
    }

    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        --bg: #111318;
        --panel: #191c23;
        --text: #f2f4f7;
        --muted: #a6adbb;
        --border: #343944;
        --input: #22262f;
        --accent: #6f8cff;
        --accent-text: #ffffff;
        --success: #62d98b;
        --danger: #ff746b;
        --shadow: 0 12px 30px rgba(0,0,0,.25);
      }
    }

    html[data-theme="dark"] {
      --bg: #111318;
      --panel: #191c23;
      --text: #f2f4f7;
      --muted: #a6adbb;
      --border: #343944;
      --input: #22262f;
      --accent: #6f8cff;
      --accent-text: #ffffff;
      --success: #62d98b;
      --danger: #ff746b;
      --shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        "Noto Sans JP",
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .page {
      width: min(720px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .topbar select {
      width: auto;
      min-width: 100px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 6vw, 38px);
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .survey-status {
      padding: 12px 14px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 700;
    }

    .survey-status.open {
      color: var(--success);
    }

    .survey-status.closed {
      color: var(--danger);
    }

    .field {
      margin-bottom: 22px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .required {
      color: var(--danger);
    }

    input[type="text"],
    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
    }

    .choice:hover {
      border-color: var(--accent);
    }

    .choice input {
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .choice span {
      min-width: 0;
    }

    .choice.disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .small {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .agreements {
      display: grid;
      gap: 10px;
    }

    .submit-row {
      margin-top: 26px;
    }

    .submit-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
    }

    .status-message {
      min-height: 24px;
      margin-top: 12px;
      font-weight: 700;
    }

    .status-message.success {
      color: var(--success);
    }

    .status-message.error {
      color: var(--danger);
    }

    .closed-box {
      padding: 24px 10px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 14px, 720px);
        padding-top: 10px;
      }

      .panel {
        padding: 17px;
        border-radius: 14px;
      }

      .topbar {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

  // Schedule constants and boundaries copied from the original S967 public index.html.
const FIRST_OPEN_KST =
  "2026-08-15T09:00:00+09:00";

const CYCLE_DAYS =
  14;

const OPEN_DAYS =
  5;

const DAY_MS =
  24 * 60 * 60 * 1000;

const cycleMs =
  CYCLE_DAYS * DAY_MS;

const openMs =
  OPEN_DAYS * DAY_MS;


function getAutomaticApplicationState(now = Date.now()) {

  const firstOpen =
    new Date(
      FIRST_OPEN_KST
    ).getTime();


  if (now < firstOpen) {
    return {
      isOpen: false,
      nextOpen: firstOpen,
    };
  }


  const elapsed =
    now - firstOpen;

  const cycleIndex =
    Math.floor(
      elapsed / cycleMs
    );

  const cycleStart =
    firstOpen +
    cycleIndex * cycleMs;

  const cycleEnd =
    cycleStart + openMs;


  if (
    now >= cycleStart &&
    now < cycleEnd
  ) {
    return {
      isOpen: true,
      closeAt: cycleEnd,
    };
  }


  return {
    isOpen: false,

    nextOpen:
      cycleStart +
      cycleMs,
  };
}

        "Без мониторинга в реальном времени роль фиксируется как обычный участник, а время участия — только вторая половина.",

      submit:
        "Отправить",

      submitting:
        "Отправка…",

      success:
        "Заявка успешно отправлена.",

      loadFailed:
        "Не удалось загрузить форму.",

      submitFailed:
        "Не удалось отправить заявку.",

      select:
        "Выберите",

      required:
        "Заполните все обязательные поля.",

      namePlaceholder:
        "Скопируйте и вставьте, пожалуйста 😉))",

      numberPlaceholder:
        "Введите число",

      applicationsOpen:
        "Приём заявок WK открыт.",

      applicationsClosed:
        "Приём заявок WK сейчас закрыт."
    }
  };


  // =========================================================
  // STATE
  // =========================================================

  const VALID_LANGUAGES =
    ["ko", "en", "ja", "ru"];

  let language =
    localStorage.getItem(
      "s1182-language"
    ) || "ko";

  if (
    !VALID_LANGUAGES.includes(
      language
    )
  ) {
    language = "ko";
  }


  let isSubmitting = false;
  let settings = null;
  let tiers = [];
  let alliances = [];
  let agreements = [];


  // =========================================================
  // ELEMENTS
  // =========================================================

  const languageSelect =
    document.getElementById(
      "languageSelect"
    );

  const themeSelect =
    document.getElementById(
      "themeSelect"
    );

  const wkForm =
    document.getElementById(
      "wkForm"
    );

  const surveyStatus =
    document.getElementById(
      "surveyStatus"
    );

  const closedBox =
    document.getElementById(
      "closedBox"
    );

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  // =========================================================
  // THEME
  // =========================================================

  const savedTheme =
    localStorage.getItem(
      "s1182-theme"
    ) || "system";

  themeSelect.value =
    savedTheme;

  document.documentElement.dataset.theme =
    savedTheme;


  themeSelect.addEventListener(
    "change",
    () => {

      const value =
        themeSelect.value;

      document.documentElement.dataset.theme =
        value;

      localStorage.setItem(
        "s1182-theme",
        value
      );

    }
  );


  // =========================================================
  // HELPERS
  // =========================================================

  function text() {
    return TEXT[language] || TEXT.ko;
  }


  function setFormStatus(
    message = "",
    type = ""
  ) {

    const element =
      document.getElementById(
        "formStatus"
      );

    element.textContent =
      message;

    element.className =
      "status-message" +
      (type ? " " + type : "");

  }


  async function parseJsonResponse(
    response
  ) {

    const data =
      await response
        .json()
        .catch(() => ({}));

    if (!response.ok) {

      const error =
        new Error(
          data.error ||
          "REQUEST_FAILED"
        );

      error.status =
        response.status;

      throw error;
    }

    return data;
  }


  async function restGet(path) {

    const response =
      await fetch(
        REST_BASE + "/" + path,
        {
          method: "GET",

          headers: {
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    return await parseJsonResponse(
      response
    );
  }


  function parseNonNegativeInteger(
    value
  ) {

    const normalized =
      String(value ?? "")
        .trim()
        .replaceAll(",", "");


    if (
      !/^\d+$/.test(
        normalized
      )
    ) {
      return null;
    }


    const number =
      Number(normalized);


    if (
      !Number.isSafeInteger(
        number
      ) ||
      number < 0
    ) {
      return null;
    }


    return number;
  }


  function getCheckedValue(
    name
  ) {

    return (
      document.querySelector(
        `input[name="${name}"]:checked`
      )?.value || ""
    );
  }


  // =========================================================
  // RADIO GROUP
  // =========================================================

  function createRadioGroup(
    containerId,
    name,
    values
  ) {

    const container =
      document.getElementById(
        containerId
      );

    container.innerHTML =
      "";


    Object.entries(values)
      .forEach(
        ([value, label]) => {

          const wrapper =
            document.createElement(
              "label"
            );

          wrapper.className =
            "choice";


          const input =
            document.createElement(
              "input"
            );

          input.type =
            "radio";

          input.name =
            name;

          input.value =
            value;

          input.required =
            true;


          const span =
            document.createElement(
              "span"
            );

          span.textContent =
            label;


          wrapper.appendChild(
            input
          );

          wrapper.appendChild(
            span
          );

          container.appendChild(
            wrapper
          );

        }
      );
  }


  function renderRadioGroups() {

    const t =
      text();


    createRadioGroup(
      "troopTypeChoices",
      "troop_type",
      t.troopTypes
    );


    createRadioGroup(
      "realtimeChoices",
      "realtime_response",
      t.realtimeOptions
    );


    createRadioGroup(
      "captainRoleChoices",
      "captain_role",
      t.captainRoles
    );


    createRadioGroup(
      "participationTimeChoices",
      "participation_time",
      t.participationTimes
    );


    document
      .querySelectorAll(
        'input[name="realtime_response"]'
      )
      .forEach(
        input => {

          input.addEventListener(
            "change",
            updateParticipationState
          );

        }
      );

  }


  // =========================================================
  // S1182 ORIGINAL PARTICIPATION BEHAVIOR
  // =========================================================

  function updateParticipationState() {
    const forced = getCheckedValue("realtime_response") === "monitor_unavailable";
    for (const [name, requiredValue] of [
      ["captain_role", "regular"],
      ["participation_time", "second_half"]
    ]) {
      document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
        if (forced) input.checked = input.value === requiredValue;
        input.disabled = forced && input.value !== requiredValue;
        input.closest(".choice")?.classList.toggle("disabled", input.disabled);
      });
    }
    const notice = document.getElementById("participationNotice");
    notice.textContent = forced ? text().forcedSecondHalf : "";
    notice.classList.toggle("hidden", !forced);
  }


  // =========================================================
  // SELECT OPTIONS
  // =========================================================

  function renderTierOptions() {

    const select =
      document.getElementById(
        "tier"
      );


    const current =
      select.value;


    select.innerHTML =
      "";


    const placeholder =
      document.createElement(
        "option"
      );

    placeholder.value =
      "";

    placeholder.textContent =
      text().select;

    select.appendChild(
      placeholder
    );


    for (
      const item of tiers
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(item.id);

      option.textContent =
        item.name;

      select.appendChild(
        option
      );

    }


    if (
      [...select.options]
        .some(
          option =>
            option.value ===
            current
        )
    ) {
      select.value =
        current;
    }

  }


  function renderAllianceOptions() {

    const select =
      document.getElementById(
        "alliance"
      );


    const current =
      select.value;


    select.innerHTML =
      "";


    const placeholder =
      document.createElement(
        "option"
      );

    placeholder.value =
      "";

    placeholder.textContent =
      text().select;

    select.appendChild(
      placeholder
    );


    for (
      const item of alliances
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(item.id);

      option.textContent =
        item.name;

      select.appendChild(
        option
      );

    }


    if (
      [...select.options]
        .some(
          option =>
            option.value ===
            current
        )
    ) {
      select.value =
        current;
    }

  }


  // =========================================================
  // DYNAMIC AGREEMENTS
  // =========================================================

  function agreementContent(
    item
  ) {

    const field =
      "content_" +
      language;


    return (
      item[field] ||
      item.content_ko ||
      ""
    );
  }


  function renderAgreements() {
    const checkedIds = new Set(
      [...document.querySelectorAll('[data-agreement-id]:checked')]
        .map(input => input.dataset.agreementId)
    );

    const section =
      document.getElementById(
        "agreementSection"
      );


    const container =
      document.getElementById(
        "agreementChoices"
      );


    container.innerHTML =
      "";


    if (
      !agreements.length
    ) {

      section.classList.add(
        "hidden"
      );

      return;
    }


    section.classList.remove(
      "hidden"
    );


    for (
      const item of agreements
    ) {

      const wrapper =
        document.createElement(
          "label"
        );

      wrapper.className =
        "choice";


      const input =
        document.createElement(
          "input"
        );

      input.type =
        "checkbox";

      input.dataset.agreementId =
        String(item.id);

      input.checked = checkedIds.has(String(item.id));

      input.required =
        Boolean(
          item.is_required
        );


      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        agreementContent(
          item
        );


      wrapper.appendChild(
        input
      );

      wrapper.appendChild(
        span
      );

      container.appendChild(
        wrapper
      );

    }

  }


  // =========================================================
  // LANGUAGE
  // =========================================================

  function setLabelText(
    id,
    value
  ) {

    const element =
      document.getElementById(
        id
      );


    const firstNode =
      element.firstChild;


    if (
      firstNode &&
      firstNode.nodeType ===
      Node.TEXT_NODE
    ) {

      firstNode.textContent =
        value + " ";

    } else {

      element.insertBefore(
        document.createTextNode(
          value + " "
        ),
        element.firstChild
      );

    }

  }


  function renderLanguage() {

    const t =
      text();


    document.documentElement.lang =
      language;


    document.title =
      "S1182 " +
      t.title;


    document.getElementById(
      "pageTitle"
    ).textContent =
      t.title;


    document.getElementById(
      "pageIntro"
    ).textContent =
      t.intro;


    document.getElementById(
      "s1182ConfirmedText"
    ).textContent =
      t.s1182;


    setLabelText(
      "playerNameLabel",
      t.name
    );

    setLabelText(
      "tierLabel",
      t.tier
    );

    setLabelText(
      "allianceLabel",
      t.alliance
    );

    setLabelText(
      "troopTypeLabel",
      t.troopType
    );

    setLabelText(
      "troopSizeLabel",
      t.troopSize
    );

    setLabelText(
      "rallySizeLabel",
      t.rallySize
    );

    setLabelText(
      "realtimeLabel",
      t.realtime
    );

    setLabelText(
      "captainRoleLabel",
      t.captainRole
    );

    setLabelText(
      "participationTimeLabel",
      t.participation
    );


    document.getElementById(
      "agreementTitle"
    ).textContent =
      t.agreementTitle;


    document.getElementById(
      "playerName"
    ).placeholder =
      t.namePlaceholder;


    document.getElementById(
      "troopSize"
    ).placeholder =
      t.numberPlaceholder;


    document.getElementById(
      "rallySize"
    ).placeholder =
      t.numberPlaceholder;


    submitButton.textContent =
      isSubmitting ? t.submitting : t.submit;


    const selectedTroop =
      getCheckedValue(
        "troop_type"
      );

    const selectedRealtime =
      getCheckedValue(
        "realtime_response"
      );

    const selectedCaptain =
      getCheckedValue(
        "captain_role"
      );

    const selectedParticipation =
      getCheckedValue(
        "participation_time"
      );


    renderRadioGroups();


    const restoreRadio =
      (name, value) => {

        if (!value) {
          return;
        }

        const input =
          document.querySelector(
            `input[name="${name}"][value="${value}"]`
          );

        if (input) {
          input.checked =
            true;
        }

      };


    restoreRadio(
      "troop_type",
      selectedTroop
    );

    restoreRadio(
      "realtime_response",
      selectedRealtime
    );

    restoreRadio(
      "captain_role",
      selectedCaptain
    );

    restoreRadio(
      "participation_time",
      selectedParticipation
    );


    renderTierOptions();

    renderAllianceOptions();

    renderAgreements();

    updateParticipationState();

    renderSurveyState();

  }


  languageSelect.value =
    language;


  languageSelect.addEventListener(
    "change",
    () => {

      const next =
        languageSelect.value;


      if (
        !VALID_LANGUAGES.includes(
          next
        )
      ) {
        return;
      }


      language =
        next;


      localStorage.setItem(
        "s1182-language",
        language
      );


      renderLanguage();

    }
  );


  // =========================================================
  // SURVEY STATE
  // =========================================================

  function renderSurveyState() {
    const now = Date.now();
    const state = resolveApplicationState(now);

    const t =
      text();


    if (!settings) {

      surveyStatus.textContent =
        t.loadFailed;

      surveyStatus.className =
        "survey-status closed";

      wkForm.classList.add(
        "hidden"
      );

      closedBox.classList.add(
        "hidden"
      );

      return;
    }


    if (
      state.isOpen
    ) {

      surveyStatus.textContent =
        t.applicationsOpen;

      surveyStatus.className =
        "survey-status open";


      closedBox.classList.add(
        "hidden"
      );


      wkForm.classList.remove(
        "hidden"
      );

    } else {

      surveyStatus.textContent =
        t.applicationsClosed;

      surveyStatus.className =
        "survey-status closed";


      closedBox.textContent =
        t.applicationsClosed;


      closedBox.classList.remove(
        "hidden"
      );


      wkForm.classList.add(
        "hidden"
      );

    }

    if (state.mode === "auto") {
      const labels = SCHEDULE_TEXT[language];
      const countdown = document.createElement("div");
      countdown.className = "small";
      countdown.textContent = (state.isOpen ? labels.closes : labels.opens) + " " +
        formatTimeLeft(state.isOpen ? state.closeAt : state.nextOpen, now);
      surveyStatus.appendChild(countdown);
    }

  }


  // =========================================================
  // LOAD DATA
  // =========================================================

  async function loadData() {

    try {

      const [
        settingsResult,
        tierResult,
        allianceResult,
        agreementResult
      ] =
        await Promise.all([

          restGet(
            "survey_settings" +
            "?select=*" +
            "&order=id.asc" +
            "&limit=1"
          ),

          restGet(
            "tiers" +
            "?select=id,name,sort_order,is_active" +
            "&is_active=eq.true" +
            "&order=sort_order.asc,id.asc"
          ),

          restGet(
            "alliances" +
            "?select=id,name,sort_order,is_active" +
            "&is_active=eq.true" +
            "&order=sort_order.asc,id.asc"
          ),

          restGet(
            "agreement_items" +
            "?select=id,content_ko,content_en,content_ja,content_ru,is_required,sort_order,is_active" +
            "&is_active=eq.true" +
            "&order=sort_order.asc,id.asc"
          )

        ]);


      settings =
        settingsResult?.[0] ||
        null;


      tiers =
        Array.isArray(
          tierResult
        )
          ? tierResult
          : [];


      alliances =
        Array.isArray(
          allianceResult
        )
          ? allianceResult
          : [];


      agreements =
        Array.isArray(
          agreementResult
        )
          ? agreementResult
          : [];


      renderLanguage();


    } catch (error) {

      console.error(
        error
      );


      settings =
        null;


      surveyStatus.textContent =
        text().loadFailed;


      surveyStatus.className =
        "survey-status closed";


      wkForm.classList.add(
        "hidden"
      );


      setFormStatus(
        text().loadFailed,
        "error"
      );

    }

  }


  // =========================================================
  // CLIENT VALIDATION
  // =========================================================

  const ALLOWED_TROOP_TYPES =
    new Set([
      "fighter",
      "shooter",
      "rider",
      "all_strong"
    ]);


  const ALLOWED_REALTIME =
    new Set([
      "monitor_available",
      "monitor_unavailable"
    ]);


  const ALLOWED_CAPTAIN_ROLES =
    new Set([
      "captain",
      "sub_captain",
      "regular",
      "negotiable"
    ]);


  const ALLOWED_PARTICIPATION =
    new Set([
      "first_half",
      "second_half",
      "full"
    ]);


  function validateForm() {

    const t =
      text();


    if (
      !resolveApplicationState().isOpen
    ) {

      return {
        ok: false,
        message:
          t.applicationsClosed
      };

    }


    if (
      !document.getElementById(
        "s1182Confirmed"
      ).checked
    ) {

      return {
        ok: false,
        message:
          t.required
      };

    }


    const playerName =
  document.getElementById(
    "playerName"
  ).value;


if (
  playerName.length < 1 ||
  playerName.length > 100
) {

  return {
    ok: false,
    message:
      t.required
  };

}
    
    const tierId =
      Number(
        document.getElementById(
          "tier"
        ).value
      );


    const allianceId =
      Number(
        document.getElementById(
          "alliance"
        ).value
      );


    if (
      !Number.isSafeInteger(
        tierId
      ) ||
      !tiers.some(
        item =>
          Number(item.id) ===
          tierId
      )
    ) {

      return {
        ok: false,
        message:
          t.required
      };

    }


    if (
      !Number.isSafeInteger(
        allianceId
      ) ||
      !alliances.some(
        item =>
          Number(item.id) ===
          allianceId
      )
    ) {

      return {
        ok: false,
        message:
          t.required
      };

    }


    const troopType =
      getCheckedValue(
        "troop_type"
      );


    const realtime =
      getCheckedValue(
        "realtime_response"
      );


    const captainRole =
      getCheckedValue(
        "captain_role"
      );


    const participation =
      getCheckedValue(
        "participation_time"
      );


    if (
      !ALLOWED_TROOP_TYPES.has(
        troopType
      ) ||
      !ALLOWED_REALTIME.has(
        realtime
      ) ||
      !ALLOWED_CAPTAIN_ROLES.has(
        captainRole
      ) ||
      !ALLOWED_PARTICIPATION.has(
        participation
      )
    ) {

      return {
        ok: false,
        message:
          t.required
      };

    }


    if (
      realtime ===
        "monitor_unavailable" &&
      (captainRole !== "regular" ||
       participation !== "second_half")
    ) {

      return {
        ok: false,
        message:
          t.required
      };

    }


    const troopSize =
      parseNonNegativeInteger(
        document.getElementById(
          "troopSize"
        ).value
      );


    const rallySize =
      parseNonNegativeInteger(
        document.getElementById(
          "rallySize"
        ).value
      );


    if (
      troopSize === null ||
      rallySize === null
    ) {

      return {
        ok: false,
        message:
          t.required
      };

    }


    const agreementIds =
      [];


    for (
      const item of agreements
    ) {

      const input =
        document.querySelector(
          `[data-agreement-id="${item.id}"]`
        );


      if (
        item.is_required &&
        !input?.checked
      ) {

        return {
          ok: false,
          message:
            t.required
        };

      }


      if (
        input?.checked
      ) {

        agreementIds.push(
          Number(item.id)
        );

      }

    }


    return {
      ok: true,

      payload: {
        language,

        s1182_confirmed:
          true,

        player_name:
          playerName,

        tier_id:
          tierId,

        alliance_id:
          allianceId,

        troop_type:
          troopType,

        troop_size:
          troopSize,

        rally_size:
          rallySize,

        realtime_response:
          realtime,

        captain_role:
          captainRole,

        participation_time:
          participation,

        agreement_ids:
          agreementIds
      }
    };

  }


  // =========================================================
  // SUBMIT
  // =========================================================

  wkForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();
      if (isSubmitting) return;


      setFormStatus();


      const validation =
        validateForm();


      if (
        !validation.ok
      ) {

        setFormStatus(
          validation.message,
          "error"
        );

        return;

      }


      isSubmitting = true;
      submitButton.disabled =
        true;

      submitButton.textContent =
        text().submitting;


      try {

        const response =
          await fetch(
            SUBMIT_URL,
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json",

                apikey:
                  SUPABASE_KEY,

                Authorization:
                  "Bearer " +
                  SUPABASE_KEY
              },

              body:
                JSON.stringify(
                  validation.payload
                )
            }
          );


        await parseJsonResponse(
          response
        );


        setFormStatus(
          text().success,
          "success"
        );


        wkForm.reset();


        renderRadioGroups();

        renderAgreements();

        updateParticipationState();


      } catch (error) {

        console.error(
          error
        );


        let message =
          text().submitFailed;


        if (
          error.message ===
          "SURVEY_CLOSED"
        ) {

          message =
            text().applicationsClosed;

        }


        setFormStatus(
          message,
          "error"
        );


      } finally {

        isSubmitting = false;
        submitButton.disabled =
          false;

        submitButton.textContent =
          text().submit;

      }

    }
  );


  // =========================================================
  // START
  // =========================================================

  renderLanguage();

  loadData();

  setInterval(renderSurveyState, 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) renderSurveyState();
  });

</script>
